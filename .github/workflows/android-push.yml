name: Android Push Build

on:
  push:
    branches:
      - "**"
    paths-ignore:
      - "*.md"
      - "**/*.md"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-24.04
    steps:
      - name: Checkout code
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          submodules: "recursive"

      - name: Validate release content
        run: python3 scripts/validate_release_content.py

      - name: Guard against new comments (any form) and AI markers
        env:
          BASE_REF: ${{ github.base_ref }}
        run: |
          set -euo pipefail
          if [ -n "${BASE_REF:-}" ]; then
            git fetch --no-tags origin "${BASE_REF}" || true
          fi
          python3 scripts/check_no_new_comments.py

      - name: Prepare google-services.json
        run: |
          set -euo pipefail
          mkdir -p app
          cat > app/google-services.json <<'JSON'
          {
            "project_info": {
              "project_number": "000000000000",
              "project_id": "ci-placeholder",
              "storage_bucket": "ci-placeholder.appspot.com"
            },
            "client": [
              {
                "client_info": {
                  "mobilesdk_app_id": "1:000000000000:android:0000000000000000000000",
                  "android_client_info": {
                    "package_name": "org.levimc.launcher"
                  }
                },
                "oauth_client": [],
                "api_key": [
                  {
                    "current_key": "AIzaSyCIOnlyPlaceholderKey"
                  }
                ],
                "services": {
                  "appinvite_service": {
                    "other_platform_oauth_client": []
                  }
                }
              }
            ],
            "configuration_version": "1"
          }
          JSON

      - name: Setup Java JDK
        uses: actions/setup-java@v6
        with:
          java-version: "21"
          distribution: temurin
          cache: gradle

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: platform-tools

      - name: Install Build Tools 35.0.0
        run: sdkmanager "build-tools;35.0.0"

      - name: Setup Xmake
        uses: xmake-io/github-action-setup-xmake@v1
        with:
          xmake-version: "2.9.9"
          actions-cache-folder: ".xmake-cache"
          actions-cache-key: "ubuntulinux-ci"

      - name: Setup Android NDK
        uses: nttld/setup-ndk@v1
        with:
          ndk-version: r28c
          link-to-sdk: true

      - name: Grant Execute Permission to gradlew
        run: chmod +x ./gradlew

      - name: Inject API Keys
        env:
          CF_API_KEY: ${{ secrets.CURSEFORGE_API_KEY }}
          DISCORD_CLIENT_ID: ${{ secrets.DISCORD_CLIENT_ID }}
        run: |
          echo "curseforge.api_key=${CF_API_KEY}" >> local.properties
          echo "discord.client_id=${DISCORD_CLIENT_ID}" >> local.properties

      - name: Build Debug, Beta and Unsigned Release APKs
        run: ./gradlew assembleDebug assembleBeta assembleRelease

      - name: Upload Debug APK
        uses: actions/upload-artifact@v7
        with:
          name: LeviLauncher-Modder-debug-apk
          path: app/build/outputs/apk/debug/*.apk

      - name: Upload R8 mappings
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: LeviLauncher-r8-mappings-${{ github.sha }}
          path: |
            app/build/outputs/mapping/debug/
            app/build/outputs/mapping/beta/
            app/build/outputs/mapping/release/
          if-no-files-found: error

      - name: Upload Unsigned Release APK
        uses: actions/upload-artifact@v7
        with:
          name: LeviLauncher-Modder-release-unsigned-apk
          path: app/build/outputs/apk/release/*-unsigned.apk

      - name: Upload Beta APK
        uses: actions/upload-artifact@v7
        with:
          name: LeviLauncher-Modder-beta-apk
          path: app/build/outputs/apk/beta/*.apk
